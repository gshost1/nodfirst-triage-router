[project]
name = "nod-first-triage-router"
version = "0.1.0"
description = "A local caregiver message triage demo"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.110",
    "openai>=1.30",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "uvicorn>=0.29",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.10",
    "pytest>=8.2",
    "ruff>=0.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"

[tool.ruff]
target-version = "py312"
line-length = 88
